name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create . --platforms=android

      - name: Override compileSdk for all subprojects
        run: |
          # Добавляем блок в корневой build.gradle.kts, который заставит ВСЕ модули (включая плагины) использовать compileSdk 36
          cat >> android/build.gradle.kts << 'EOF'

          subprojects {
              afterEvaluate {
                  if (project.extensions.findByName("android") != null) {
                      val androidExt = project.extensions.getByName("android") as com.android.build.gradle.BaseExtension
                      androidExt.compileSdkVersion(36)
                  }
              }
          }
          EOF

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: breath-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
